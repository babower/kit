[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kit-charts"
version = "0.1.0"
description = "Dependency-free SVG charts, a validated palette and light/dark tokens for server-rendered dashboards."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "markupsafe>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kit_charts = ["*.js", "*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
